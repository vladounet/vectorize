[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "logo-vectorize"
version = "0.1.0"
description = "Turn low-resolution monochrome logos into vector and raster asset sets"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY.md"]
authors = [{name = "Vlad Trifa"}]
keywords = ["logo", "svg", "vector", "potrace", "png"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
  "Programming Language :: Python :: 3",
]
dependencies = ["numpy>=1.23", "Pillow>=10", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1", "twine>=5"]

[project.scripts]
vectorize = "vectorize:main"

[project.urls]
Homepage = "https://github.com/vladounet/vectorize"
Issues = "https://github.com/vladounet/vectorize/issues"

[tool.setuptools]
py-modules = ["vectorize"]

[tool.pytest.ini_options]
testpaths = ["tests"]
